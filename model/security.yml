# Row-level security, compiled into the SQL at plan time.
#
# Measures tagged `finance` (wholesale cost, net profit, margin) are filtered to the customer
# states the caller may see. The states come from `state:` tags on the
# caller's groups: the Redash runner turns a Redash group named `state:TX`
# into that tag. A caller with no such group gets no rows on those measures;
# Redash admins plan as system admins and bypass the policy.
policies:
  - name: Profit By Customer State
    mode: filter_data
    triggers:
      field_tags: [finance]
    context_dimension: Customer State
    permission_resolution:
      source: groups
      value_from: tag
      tag_key: state
      unresolved: deny
    bypass:
      system_admin: true
      project_admin: true
