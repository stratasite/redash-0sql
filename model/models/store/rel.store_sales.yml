# Joins the planner may take from Store Sales. Each is many sales to one
# dimension row, so measures never fan out.
datasource: tpcds

store_sales_date:
  left: Store Sales
  right: Date
  sql: left.ss_sold_date_sk = right.d_date_sk
  cardinality: many_to_one

store_sales_store:
  left: Store Sales
  right: Store
  sql: left.ss_store_sk = right.s_store_sk
  cardinality: many_to_one

store_sales_item:
  left: Store Sales
  right: Item
  sql: left.ss_item_sk = right.i_item_sk
  cardinality: many_to_one

store_sales_customer_address:
  left: Store Sales
  right: Customer Address
  sql: left.ss_addr_sk = right.ca_address_sk
  cardinality: many_to_one
