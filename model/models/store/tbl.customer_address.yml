name: Customer Address
physical_name: customer_address
datasource: tpcds
cost: 10

fields:
  - type: dimension
    name: Customer State
    description: State of the address the sale shipped to
    data_type: string
    expression:
      lookup: true
      sql: ca_state

  - type: dimension
    name: Customer City
    data_type: string
    expression:
      lookup: true
      sql: ca_city

  - type: dimension
    name: Customer Country
    data_type: string
    expression:
      lookup: true
      sql: ca_country
