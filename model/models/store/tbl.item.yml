name: Item
physical_name: item
datasource: tpcds
cost: 10

fields:
  - type: dimension
    name: Item Category
    data_type: string
    expression:
      lookup: true
      sql: i_category

  - type: dimension
    name: Item Class
    data_type: string
    expression:
      lookup: true
      sql: i_class

  - type: dimension
    name: Brand
    data_type: string
    expression:
      lookup: true
      sql: i_brand

  - type: dimension
    name: Item Name
    data_type: string
    expression:
      lookup: true
      sql: i_product_name
